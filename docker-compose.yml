#
# docker-compose.yml for Hermes Agent
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose up -d
#
# Set HERMES_UID / HERMES_GID to the host user that owns ~/.hermes so
# files created inside the container stay readable/writable on the host.
# The s6-overlay stage2 hook remaps the internal `hermes` user to these
# values via usermod/groupmod; each supervised service then drops to that
# user via `s6-setuidgid`.
#
# Security notes:
#   - The dashboard service binds to 127.0.0.1 by default. It stores API
#     keys; exposing it on LAN without auth is unsafe. If you want remote
#     access, use an SSH tunnel or put it behind a reverse proxy that
#     adds authentication — do NOT pass --insecure --host 0.0.0.0.
#   - If you override entrypoint, keep `/init` as the first command in
#     the chain (or let docker use the image's default ENTRYPOINT,
#     which is `["/init", "/opt/hermes/docker/main-wrapper.sh"]`).
#     `/init` is s6-overlay's PID 1 — it runs the cont-init.d scripts
#     (chown, profile reconcile, dashboard toggle) and sets up the
#     supervision tree before any service starts. Bypassing it skips
#     all of that setup and the gateway will not work correctly.
#   - The gateway's API server is off unless you uncomment API_SERVER_KEY
#     and API_SERVER_HOST. See docs/user-guide/api-server.md before doing
#     this on an internet-facing host.
#
services:
  gateway:
    build: .
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # To expose the OpenAI-compatible API server beyond localhost,
      # uncomment BOTH lines (API_SERVER_KEY is mandatory for auth):
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
      # Microsoft Teams — uncomment and fill in to enable Teams gateway.
      # Register your bot at https://dev.botframework.com/ to get these values.
      # - TEAMS_CLIENT_ID=${TEAMS_CLIENT_ID}
      # - TEAMS_CLIENT_SECRET=${TEAMS_CLIENT_SECRET}
      # - TEAMS_TENANT_ID=${TEAMS_TENANT_ID}
      # - TEAMS_ALLOWED_USERS=${TEAMS_ALLOWED_USERS}
      # - TEAMS_PORT=${TEAMS_PORT:-3978}
      # Google Chat — uncomment and fill in to enable the Google Chat gateway.
      # See website/docs/user-guide/messaging/google_chat.md for the full setup.
      # The SA JSON path must point to a file mounted into the container —
      # add a volume entry above (e.g. ``- ~/.hermes/google-chat-sa.json:/secrets/google-chat-sa.json:ro``)
      # then set GOOGLE_CHAT_SERVICE_ACCOUNT_JSON to that mount path.
      # - GOOGLE_CHAT_PROJECT_ID=${GOOGLE_CHAT_PROJECT_ID}
      # - GOOGLE_CHAT_SUBSCRIPTION_NAME=${GOOGLE_CHAT_SUBSCRIPTION_NAME}
      # - GOOGLE_CHAT_SERVICE_ACCOUNT_JSON=${GOOGLE_CHAT_SERVICE_ACCOUNT_JSON}
      # - GOOGLE_CHAT_ALLOWED_USERS=${GOOGLE_CHAT_ALLOWED_USERS}
    command: ["gateway", "run"]

  dashboard:
    image: hermes-agent
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gateway
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    # Bound to 0.0.0.0 so the /api/ws host-header guard doesn't reject
    # SSH-tunneled clients (bound_host must match the client's Host header,
    # and a tunneled client's Host header is never a bare "127.0.0.1").
    # Actual access control is the firewall: this port is NOT opened in ufw,
    # so it's still only reachable via `ssh -L 9119:localhost:9119` or from
    # inside the VPS itself. HERMES_DASHBOARD_BASIC_AUTH_* env vars are
    # mandatory here — a non-loopback bind fails closed without them.
    #
    # Do NOT wrap this command (e.g. `sh -c "unset ...; exec ..."`) to strip
    # TELEGRAM_BOT_TOKEN from this container's environment — tried that, it
    # doesn't work and it actively breaks something important. Two reasons:
    #
    # 1. Coolify injects every resource-level env var into every service in
    #    this file, regardless of which service's `environment:` block
    #    references it — so this container gets the same TELEGRAM_BOT_TOKEN
    #    as `gateway` even though it's never supposed to talk to Telegram.
    #    But `docker exec <this-container> hermes gateway run` (the actual
    #    way this has bitten us — an operator manually starting a gateway
    #    here, not the dashboard process spawning one itself) starts a
    #    brand-new process tree from the container's base Docker env, not
    #    from whatever this command line did — so unsetting the var here
    #    doesn't protect against that path at all.
    # 2. hermes_cli/container_boot.py's `_is_dashboard_container()` guard
    #    (which DOES correctly stop this profile's gateway from
    #    auto-starting at boot — the actual working protection) detects the
    #    role by parsing this container's argv for a bare `dashboard` token
    #    right after `main-wrapper.sh`. Wrapping the command in `sh -c
    #    "...main-wrapper.sh dashboard..."` buries that token inside a
    #    single quoted string, so it's no longer its own argv entry — the
    #    detector stops recognizing this as a dashboard container, and the
    #    cont-init reconciler starts a SECOND gateway here on every single
    #    boot/redeploy instead of only when someone manually runs one.
    #    Confirmed this regression live on 2026-08-09; reverted same day.
    #
    # There's no known way to close the credential-sharing gap from this
    # file alone. Mitigation for now is operational: never run `hermes
    # gateway *` commands against this container — only against `gateway`.
    command: ["dashboard", "--host", "0.0.0.0", "--no-open"]
